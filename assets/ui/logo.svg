<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="ОДИН УДАР">
  <!--
    Присланный логотип был набран путями и складывался в «FLINELI» — набор
    латинских букв, к названию отношения не имеющий. Здесь надпись сделана
    текстом: буквы всегда те, что написаны, а не те, что случайно вышли из
    кривых. Композиция сохранена — рамка, светлая надпись, кислотная черта.
  -->
  <rect x="8" y="10" width="404" height="100" fill="#12081c" stroke="#ff1f8f" stroke-width="3"/>
  <text x="210" y="72"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="900" letter-spacing="5"
        fill="#f5f0e6">ОДИН УДАР</text>
  <rect x="31" y="101" width="358" height="5" fill="#76ff9f"/>
</svg>
