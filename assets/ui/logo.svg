<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="ОДИН УДАР">
  <!--
    Из поставки, где всё остальное оказалось пустым: тайлсеты в одну
    краску, персонаж в три цвета. Логотип единственный уцелел и написан
    текстом, а не кривыми, — значит, буквы всегда те, что написаны. Ровно
    на этом сорвалась первая поставка: набранный путями логотип складывался
    в «FLINELI».
  -->
  <rect x="20" y="20" width="760" height="360" rx="15" fill="#12081c" stroke="#ff1f8f" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="330" rx="10" fill="none" stroke="#2ce8ff" stroke-width="4"/>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <text x="400" y="190" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="95" fill="#76ff9f" text-anchor="middle" filter="url(#glow)" stroke="#ff1f8f" stroke-width="3">ОДИН УДАР</text>
  <text x="400" y="270" font-family="'Courier New', monospace, sans-serif" font-weight="bold" font-size="32" fill="#ffe06b" text-anchor="middle" letter-spacing="6">ONE STRIKE // CYBERPUNK</text>
</svg>